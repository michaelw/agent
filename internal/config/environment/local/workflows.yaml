version: "1.0"
workflows:
  local_simple_elevation:
    name: "Local Simple Elevation"
    description: Simple local access elevation without approval for development
    authentication: default
    enabled: true
    workflow:
      document:
        dsl: "1.0.0-alpha5"
        namespace: "thand"
        name: "local-simple-elevation"
        version: "1.0.0"
      do:
        - validate:
            thand: validate
            with:
              validator: static
            then: authorize
        - authorize:
            thand: authorize
            with:
              revocation: revoke
            then: monitor
        - monitor:
            thand: monitor
            with:
              monitor: basic
              threshold: 100
            then: revoke
        - revoke:
            thand: revoke
            then: end

  local_sudo_timed_elevation:
    name: "Local Sudo Timed Elevation"
    description: Time-bound local sudo access with managed revocation
    authentication: default
    enabled: true
    workflow:
      document:
        dsl: "1.0.0-alpha5"
        namespace: "thand"
        name: "local-sudo-timed-elevation"
        version: "1.0.0"
      do:
        - validate:
            thand: validate
            with:
              validator: static
            then: authorize
        - authorize:
            thand: agent
            with:
              identities: '${ $context.metadata.target_agent }'
            do:
              - authorize_local:
                  thand: authorize
                  with:
                    revocation: revoke
            then: monitor
        - monitor:
            thand: monitor
            with:
              monitor: basic
              threshold: 100
            then: revoke
        - revoke:
            thand: agent
            with:
              identities: '${ $context.metadata.target_agent }'
            do:
              - revoke_local:
                  thand: revoke
            then: end

  local_sudo_command_elevation:
    name: "Local Sudo Command Elevation"
    description: Broker a single privileged command and revoke immediately afterwards
    authentication: default
    enabled: true
    workflow:
      document:
        dsl: "1.0.0-alpha5"
        namespace: "thand"
        name: "local-sudo-command-elevation"
        version: "1.0.0"
      do:
        - validate:
            thand: validate
            with:
              validator: static
            then: authorize
        - authorize:
            thand: agent
            with:
              identities: '${ $context.metadata.target_agent }'
            do:
              - authorize_local:
                  thand: authorize
                  with:
                    revocation: revoke
            then: revoke
        - revoke:
            thand: agent
            with:
              identities: '${ $context.metadata.target_agent }'
            do:
              - revoke_local:
                  thand: revoke
            then: end
